[package]
name = "floaty"
version = "0.1.1"
description = "Floaty - widgets living on your desktop"
authors = ["floaty"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
# plugin notifications: raised from Rust (`floaty_notify`) so a third-party plugin
# needs no capability of its own to say something
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-autostart = "2.5.1"
# the launcher hotkey: one global shortcut, handled in Rust (no JS permissions needed)
tauri-plugin-global-shortcut = "2"
# updating in place: the updater checks a signed manifest and the process plugin restarts
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# WASAPI loopback capture for the audio visualizer (system output, not the mic)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
